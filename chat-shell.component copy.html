<!-- chat-shell.component.html -->

<div class="chat-shell" [class.sidebar-collapsed]="store.sidebarCollapsed()">

  <!-- Sidebar -->
  <aside class="chat-shell__sidebar" [attr.aria-hidden]="store.sidebarCollapsed()">
    <app-sidebar />
  </aside>

  <!-- Toggle tab — always visible -->
  <button
    class="chat-shell__toggle"
    (click)="store.toggleSidebar()"
    [attr.aria-label]="store.sidebarCollapsed() ? 'Open sidebar' : 'Close sidebar'"
    [title]="store.sidebarCollapsed() ? 'Open sidebar' : 'Close sidebar'"
  >
    <span class="chat-shell__toggle-icon">
      {{ store.sidebarCollapsed() ? '›' : '‹' }}
    </span>
  </button>

  <!-- Main content -->
  <main class="chat-shell__main">

    @if (store.activeConversationId()) {
      <!-- Chat window when conversation selected -->
      <app-chat-window />
    } @else {
      <!-- No conversation selected -->
      <div class="chat-shell__empty">
        <div class="chat-shell__empty-icon">💬</div>
        <h3 class="chat-shell__empty-title">NextGen AMS IT Support</h3>
        <p class="chat-shell__empty-subtitle">
          Select a conversation from the sidebar or click "New Chat" to get started
        </p>
        <button
          class="chat-shell__empty-btn"
          (click)="store.createConversation()"
        >
          + Start New Chat
        </button>
      </div>
    }

  </main>

</div>
